name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

        Before submitting, please check the [architecture document](https://github.com/samsoir/ortho4-xearthlayer-orchestrator/blob/main/docs/specs/2026-10-01-oxo-architecture-design.md), in particular its "Out of scope" section, to see whether the idea is already planned or deliberately excluded.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it address?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked the architecture document's "Out of scope" section
          required: true
        - label: I have searched existing issues to ensure this hasn't already been requested
          required: true
