name: Bug Report
description: Report a bug or issue with OXO
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us diagnose the issue.

        **Note:** Ortho4XP exits 0 even when it fails, so a task that "finished" is not evidence it worked. Please include the worker's log for the failing task.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of OXO is affected?
      options:
        - oxo-controld (control plane / HTTP API)
        - oxo-worker (worker pod)
        - oxo-spec (region specification / validation)
        - Worker image / Python runner
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Submit a region spec with '...'
        2. Start a worker with '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit hash (`git rev-parse --short HEAD`).
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How OXO is deployed.
      render: text
      placeholder: |
        Container platform: Podman 5.x / Kubernetes 1.x
        OS: ...
        Rust version (if built from source): ...
        Ortho4XP commit in the worker image: ...
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: Region Specification
      description: The region spec involved, if relevant. Redact any private paths.
      render: toml

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Control plane or worker output (`RUST_LOG=info` is usually enough), including the failing task's reported phase and reason.
      render: text

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Crash / Data Loss
        - Major functionality broken
        - Minor functionality broken
        - Performance issue
        - Documentation issue
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this bug hasn't already been reported
          required: true
        - label: I have included the relevant logs and version information
          required: true
